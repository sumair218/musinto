name: musinto
description: Musinto - music streaming app (auth & onboarding flow).
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8
  country_picker: ^2.0.28
  flutter_svg: ^2.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - lib/assets/Media/
    - lib/assets/images/
    - lib/assets/icons/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: lib/assets/images/logo.png
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: lib/assets/images/logo.png
  web:
    generate: true
    image_path: lib/assets/images/logo.png
    background_color: "#FFFFFF"
    theme_color: "#FF2D6F"
  windows:
    generate: true
    image_path: lib/assets/images/logo.png
    icon_size: 256
  macos:
    generate: true
    image_path: lib/assets/images/logo.png
